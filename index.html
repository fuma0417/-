
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自己紹介ページ</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #101116;
      color: #f5f5f7;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #1b1c24;
      border: 1px solid #30313c;
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 20px 60px #0005;
    }

    .avatar {
      width: 100px;
      height: 100px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8b5cf6, #38bdf8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
    }

    .tag {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      background: #292a36;
      color: #a5b4fc;
      font-size: 12px;
      letter-spacing: 1px;
    }

    h1 {
      font-size: 28px;
      margin: 16px 0 8px;
    }

    .subtitle {
      color: #a1a1aa;
      font-size: 14px;
    }

    .about {
      margin-top: 28px;
      text-align: left;
    }

    .about h2 {
      font-size: 16px;
      margin-bottom: 10px;
    }

    .about p {
      color: #c4c4cc;
      font-size: 14px;
      line-height: 1.9;
    }

    .interests {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }

    .interest {
      background: #292a36;
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 13px;
    }

    footer {
      color: #71717a;
      font-size: 12px;
      margin-top: 28px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar">👋</div>

    <span class="tag">MY PROFILE</span>

    <h1>あなたの名前</h1>
    <p class="subtitle">Hello, nice to meet you!</p>

    <section class="about">
      <h2>About me</h2>
      <p>
        はじめまして！<br>
        ここに自分の自己紹介を書こう。<br>
        好きなことや、最近ハマっていることなどを
        自由に紹介してね。
      </p>
    </section>

    <section class="about">
      <h2>My interests</h2>
      <div class="interests">
        <span class="interest">🎵 音楽</span>
        <span class="interest">🎮 ゲーム</span>
        <span class="interest">💻 Web制作</span>
      </div>
    </section>

    <footer>Thanks for visiting my page ✦</footer>
  </main>
</body>
</html>
